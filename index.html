<title>Exclusive balloons — Наборы шаров в Кишинёве</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* ===== Общее ===== */
  body { margin: 0; font-family: "Exo 2", "Segoe UI", Arial, sans-serif; }

  /* ===== Шапка ===== */
  .site-header { font-family: "Exo 2", "Segoe UI", Arial, sans-serif; }
  .site-header * { box-sizing: border-box; }

  .site-header__top {
    position: relative;
    z-index: 1;
    height: 72px;
    background: linear-gradient(90deg, #f6f4f5 40%, #f2f0f1 100%);
    box-shadow: 0 1px 6px rgba(0, 0, 0, .14);
  }

  .site-header__inner {
    width: min(1040px, 100%);
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
  }

  .site-header__brand {
    justify-self: start;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #9d1346;
    text-decoration: none;
  }
  .site-header__logo { height: 60px; width: auto; align-self: flex-start; margin-top: 4px; display: block; }
  .site-header__name { font-size: 25px; font-weight: 500; line-height: 1; white-space: nowrap; }

  .site-header__search {
    position: relative;
    width: 272px;
    height: 34px;
    margin: 0;
  }
  .site-header__search input {
    width: 100%;
    height: 100%;
    padding: 0 40px 0 14px;
    border: 1px solid #b9b9b9;
    border-radius: 17px;
    background: #fff;
    color: #1a1a1a;
    font: 400 13px "Exo 2", "Segoe UI", Arial, sans-serif;
    outline: none;
  }
  .site-header__search input::placeholder { color: #8a8a8a; }
  .site-header__search input:focus { border-color: #9d1346; }
  .site-header__search button {
    position: absolute;
    top: 0;
    right: 6px;
    width: 32px;
    height: 100%;
    padding: 0;
    border: 0;
    background: none;
    color: #1a1a1a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .site-header__search svg { width: 18px; height: 18px; }

  /* Кнопка языка — один объект: значок и код внутри одной кнопки */
  .site-header__lang {
    justify-self: end;
    margin-right: clamp(0px, 4.7vw, 64px);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 12px;
    border: 0;
    border-radius: 18px;
    background: transparent;
    color: #1a1a1a;
    font: 600 14px "Exo 2", "Segoe UI", Arial, sans-serif;
    cursor: pointer;
  }
  .site-header__lang:hover { background: rgba(0, 0, 0, .06); }
  .site-header__lang:focus-visible { outline: 2px solid #9d1346; outline-offset: 2px; }
  .site-header__lang svg { width: 19px; height: 19px; display: block; }

  .site-header__nav {
    background: #fff;
    height: 28px;
    padding-right: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .site-header__nav::-webkit-scrollbar { display: none; }
  .site-header__nav button {
    flex: none; padding: 0; border: 0; background: none; cursor: pointer;
    color: #1a1a1a; font: 400 12.5px "Exo 2", "Segoe UI", Arial, sans-serif;
    text-decoration: underline transparent; text-decoration-thickness: 2px; text-underline-offset: 3px;
  }
  .site-header__nav button:hover { color: #9d1346; }
  .site-header__nav button[aria-pressed="true"] { color: #9d1346; text-decoration-color: #9d1346; }
  .site-header__nav button:focus-visible { outline: 2px solid #9d1346; outline-offset: 3px; border-radius: 2px; }

  /* Телефоны: логотип и язык в первой строке, поиск — под ними */
  @media (max-width: 720px) {
    .site-header__top { height: auto; padding: 8px 12px; }
    .site-header__inner { grid-template-columns: minmax(0, 1fr) auto; row-gap: 8px; }
    .site-header__search { grid-row: 2; grid-column: 1 / -1; width: 100%; }
    .site-header__lang { margin-right: 0; }
    .site-header__name { font-size: 21px; }
    .site-header__nav { justify-content: flex-start; padding: 0 12px; }
  }

  /* ===== Заголовок и быстрые категории (между шапкой и карточками) ===== */
  .shop-intro {
    /* шрифт блока — как на макете; чтобы взять шрифт сайта, замените на "Exo 2" */
    --intro-font: "Open Sans", "Segoe UI", Arial, sans-serif;
    --intro-accent: #9d1346;
    /* светлый ореол: на чистой стене не виден, а на тёмных шарах фона держит текст читаемым */
    --intro-halo: 0 0 2px #fff, 0 0 6px #fff, 0 0 12px #fff, 0 0 20px rgba(255, 255, 255, .85);
    padding: clamp(32px, 7.8vw, 64px) 16px 8px;
    text-align: center;
    color: #000;
    font-family: var(--intro-font);
  }
  .shop-intro *, .shop-intro *::before, .shop-intro *::after { box-sizing: border-box; }

  .shop-intro__title {
    margin: 0;
    font-size: clamp(22px, 4.4vw, 36px);
    font-weight: 700;
    line-height: 1.2;
    text-wrap: balance;
    text-shadow: var(--intro-halo);
  }

  .shop-intro__cats {
    margin-top: clamp(32px, 10.4vw, 88px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 20px clamp(24px, 5.9vw, 48px);
  }

  .shop-intro__cat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 4px 6px;
    border: 0;
    border-radius: 10px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .shop-intro__icon {
    width: clamp(56px, 8.8vw, 72px);
    height: clamp(56px, 8.8vw, 72px);
    display: block;
    transition: transform .15s ease;
  }

  .shop-intro__label {
    font-size: clamp(14px, 2.2vw, 18px);
    font-weight: 400;
    line-height: 1.3;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
    text-shadow: var(--intro-halo);
  }

  .shop-intro__cat:hover .shop-intro__label { color: var(--intro-accent); }
  .shop-intro__cat:hover .shop-intro__icon { transform: translateY(-2px); }
  .shop-intro__cat[aria-pressed="true"] .shop-intro__label {
    color: var(--intro-accent);
    text-decoration: underline;
    text-decoration-color: var(--intro-accent);
  }
  .shop-intro__cat:focus-visible { outline: 2px solid var(--intro-accent); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .shop-intro__icon { transition: none; }
    .shop-intro__cat:hover .shop-intro__icon { transform: none; }
  }

  /* Телефоны: кнопки в два ряда по две */
  @media (max-width: 600px) {
    .shop-intro__cats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 12px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }
    .shop-intro__label { font-size: 15px; }
  }

  /* ===== Каталог товаров ===== */
  .catalog { padding: 32px 16px 48px; }
  .catalog__grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 190px));
    gap: 24px 18px;
    justify-content: center;
  }
  .catalog__card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .catalog__card[hidden] { display: none; }
  .catalog__card { cursor: pointer; }
  .catalog__card:focus-visible { outline: 3px solid #9d1346; outline-offset: 2px; }

  /* ===== Окно товара ===== */
  .modal {
    position: fixed; inset: 0; z-index: 100; padding: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55);
    font-family: "Exo 2", "Segoe UI", Arial, sans-serif;
  }
  .modal[hidden] { display: none; }
  .modal__box {
    position: relative; width: min(720px, 100%); max-height: 92vh; overflow: auto;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px;
    padding: 20px; border-radius: 14px; background: #fff; color: #1a1a1a;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  .modal__close {
    position: absolute; top: 8px; right: 8px; z-index: 1; width: 34px; height: 34px; padding: 0;
    border: 0; border-radius: 50%; background: rgba(0, 0, 0, .08); color: #1a1a1a;
    font-size: 22px; line-height: 34px; cursor: pointer;
  }
  .modal__close:hover { background: rgba(0, 0, 0, .16); }
  .modal__photo { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border-radius: 10px; background: #eee; }
  .modal__thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .modal__thumbs button {
    width: 48px; height: 48px; padding: 0; border: 2px solid transparent; border-radius: 6px;
    overflow: hidden; background: none; cursor: pointer;
  }
  .modal__thumbs button[aria-current="true"] { border-color: #9d1346; }
  .modal__thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal__info { min-width: 0; padding-right: 26px; }
  .modal__name { margin: 0 0 8px; font-size: 20px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .modal__price { margin-bottom: 12px; font-size: 22px; font-weight: 600; color: #9d1346; }
  .modal__desc { margin: 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .modal__desc[hidden] { display: none; }
  @media (max-width: 640px) {
    .modal__box { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 16px; }
    .modal__info { padding-right: 0; }
  }
  .catalog__empty {
    max-width: 320px; margin: 0 auto; padding: 12px 16px; border-radius: 10px;
    background: rgba(255, 255, 255, .92); box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    text-align: center; font-size: 14px; color: #1a1a1a;
  }
  .catalog__empty[hidden] { display: none; }
  .catalog__photo { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #eee; }
  .catalog__body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .catalog__name {
    font-size: 12px; line-height: 1.3; color: #1a1a1a;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 2.6em;
  }
  .catalog__price { font-size: 13px; font-weight: 600; color: #1a1a1a; }

  @media (max-width: 600px) {
    .catalog { padding: 20px 12px 32px; }
    .catalog__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  }

  /* ===== Футер ===== */
  .site-footer {
    --footer-bg: #ffe4e6;
    --footer-text: #1a1a1a;
    --footer-font: "Exo 2", "Segoe UI", Arial, sans-serif;

    /* Плавные размеры: сами подстраиваются под ширину экрана */
    --footer-pad-y: clamp(16px, 3vw, 36px);
    --footer-pad-x: clamp(8px, 2vw, 20px);
    --footer-gap: clamp(12px, 2.5vw, 28px);
    --footer-title: clamp(13px, 1vw, 14px);
    --footer-text-size: clamp(12px, 0.9vw, 13px);
    --footer-map-height: clamp(110px, 14vw, 170px);

    box-sizing: border-box;
    background: var(--footer-bg);
    color: var(--footer-text);
    font-family: var(--footer-font);
    padding: var(--footer-pad-y) var(--footer-pad-x);
    /* отступ снизу для телефонов с "чёлкой" и жестовой панелью */
    padding-bottom: max(var(--footer-pad-y), env(safe-area-inset-bottom));
    width: 100%;
  }

  .site-footer *,
  .site-footer *::before,
  .site-footer *::after {
    box-sizing: border-box;
  }

  .site-footer__inner {
    max-width: 500px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: var(--footer-gap);
    align-items: center;
  }

  .site-footer__title {
    margin: 0 0 clamp(7px, 1vw, 12px);
    font-size: var(--footer-title);
    font-weight: 600;
    line-height: 1.25;
  }

  .site-footer__list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: clamp(5px, 0.8vw, 8px);
  }

  .site-footer__item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: var(--footer-text-size);
    line-height: 1.4;
    min-width: 0;
  }

  .site-footer__item svg {
    flex: none;
    width: 1.3em;
    height: 1.3em;
    fill: currentColor;
  }

  .site-footer a {
    color: inherit;
    text-decoration: none;
    overflow-wrap: anywhere; /* длинный адрес не вылезет за экран */
  }

  .site-footer a:hover,
  .site-footer a:focus-visible {
    text-decoration: underline;
  }

  .site-footer a:focus-visible {
    outline: 2px solid var(--footer-text);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* Адрес — с подчёркиванием, как в макете */
  .site-footer__address {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Место для карты */
  .site-footer__map {
    width: 100%;
    height: var(--footer-map-height);
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.15);
  }

  .site-footer__map iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---------- Большие мониторы (от 1400px) ---------- */
  @media (min-width: 1400px) {
    .site-footer__inner { max-width: 600px; }
  }

  /* ---------- Планшеты (до 1024px) ---------- */
  @media (max-width: 1024px) {
    .site-footer__inner {
      /* контактам чуть больше места, карта немного уже */
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    }
  }

  /* ---------- Телефоны и планшеты в портретной ориентации (до 720px) ---------- */
  @media (max-width: 720px) {
    .site-footer__inner {
      grid-template-columns: minmax(0, 1fr);
      align-items: stretch;
    }

    /* удобные для нажатия пальцем строки */
    .site-footer__item {
      min-height: 22px;
    }

    .site-footer__map {
      height: clamp(120px, 32vw, 170px);
    }
  }

  /* ---------- Маленькие телефоны (до 380px) ---------- */
  @media (max-width: 380px) {
    .site-footer {
      --footer-pad-x: 7px;
      --footer-text-size: 12px;
    }

    .site-footer__item { gap: 4px; }
  }

  /* ---------- Телефон в горизонтальном положении (низкий экран) ---------- */
  @media (max-height: 500px) and (orientation: landscape) {
    .site-footer { --footer-pad-y: 12px; }
    .site-footer__map { height: 100px; }
  }
</style>
</head>

<!-- Язык, поиск и каталог: товары берутся из базы, куда их добавляет панель администратора -->
<script src="site-config.js"></script>
<script>
  (function () {
    /* ---------- переводы ---------- */
    var I18N = {
      ru: {
        nav_foil: 'Шары фольга', nav_digits: 'Цифры', nav_figures: 'Фигуры', nav_text: 'С надписью',
        nav_latex: 'Шары латексные', nav_party: 'Артикулы для праздника', nav_comp: 'Композиции',
        search_ph: 'Найти товары и магазины', search_aria: 'Поиск', search_btn: 'Искать',
        contact_title: 'Связаться с нами', empty: 'Ничего не найдено', currency: 'лей',
        lang_aria: 'Сменить язык на румынский', close: 'Закрыть',
        intro_title: 'Наборы шаров в Кишинёве', intro_cats_aria: 'Категории товаров',
        quick_all: 'Все товары', quick_digits: 'Цифры', quick_text: 'С надписью', quick_foil: 'Фольгированные шары',
        page_title: 'Exclusive balloons — Наборы шаров в Кишинёве', map_title: 'Карта: Exclusive Balloons'
      },
      ro: {
        nav_foil: 'Baloane folie', nav_digits: 'Cifre', nav_figures: 'Figuri', nav_text: 'Cu mesaj',
        nav_latex: 'Baloane din latex', nav_party: 'Articole pentru petreceri', nav_comp: 'Compoziții',
        search_ph: 'Caută produse și magazine', search_aria: 'Căutare', search_btn: 'Caută',
        contact_title: 'Contactează-ne', empty: 'Nu s-a găsit nimic', currency: 'lei',
        lang_aria: 'Schimbă limba în rusă', close: 'Închide',
        intro_title: 'Seturi de baloane în Chișinău', intro_cats_aria: 'Categorii de produse',
        quick_all: 'Toate produsele', quick_digits: 'Cifre', quick_text: 'Cu mesaj', quick_foil: 'Baloane din folie',
        page_title: 'Exclusive balloons — Seturi de baloane în Chișinău', map_title: 'Harta: Exclusive Balloons'
      }
    };

    var lang = 'ru';
    try {
      var saved = localStorage.getItem('lang');
      if (saved === 'ru' || saved === 'ro') lang = saved;
    } catch (e) {}
    function t(key) { return I18N[lang][key]; }

    var grid = document.getElementById('catalog');
    var emptyEl = document.getElementById('catalogEmpty');
    var searchForm = document.getElementById('searchForm');
    var searchInput = document.getElementById('searchInput');
    var langBtn = document.getElementById('langBtn');
    var langCode = document.getElementById('langCode');
    var items = [];   // карточки каталога: {el, p, nameEl, priceEl, key}
    var current = null;   // товар, открытый в окне
    var activeCat = '';   // выбранная категория (фильтр из меню)

    // название на выбранном языке (румынское, если оно заполнено)
    function displayName(p) { return lang === 'ro' && p.name_ro ? p.name_ro : p.name; }
    // описание на выбранном языке (румынское, если заполнено)
    function displayDesc(p) { return lang === 'ro' && p.description_ro ? p.description_ro : (p.description || ''); }

    function applyLang() {
      document.documentElement.lang = lang;
      document.title = t('page_title');
      Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-placeholder]'), function (el) {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {
        el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
      });
      var map = document.querySelector('.site-footer__map iframe');
      if (map) map.title = t('map_title');
      langCode.textContent = lang.toUpperCase();
      langBtn.setAttribute('aria-label', t('lang_aria'));
      items.forEach(function (it) {
        it.priceEl.textContent = it.p.price + ' ' + t('currency');
        it.nameEl.textContent = displayName(it.p);
        it.el.querySelector('img').alt = displayName(it.p);
      });
      renderModal();
    }

    langBtn.addEventListener('click', function () {
      lang = lang === 'ru' ? 'ro' : 'ru';
      try { localStorage.setItem('lang', lang); } catch (e) {}
      applyLang();
    });

    /* ---------- поиск по названию ---------- */
    function norm(str) {
      return String(str || '').toLowerCase().replace(/ё/g, 'е')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    }

    function filterCatalog() {
      var q = norm(searchInput.value);
      var shown = 0;
      items.forEach(function (it) {
        var ok = (!q || it.key.indexOf(q) !== -1) && (!activeCat || it.p.category === activeCat);
        it.el.hidden = !ok;
        if (ok) shown++;
      });
      emptyEl.hidden = !((q || activeCat) && shown === 0);
    }

    // категории в меню и кнопки под заголовком — фильтр; повторный клик снимает фильтр;
    // кнопка «Все товары» (data-cat="") просто сбрасывает фильтр
    var catButtons = document.querySelectorAll('[data-cat]');
    Array.prototype.forEach.call(catButtons, function (btn) {
      btn.addEventListener('click', function () {
        var c = btn.getAttribute('data-cat');
        activeCat = activeCat === c ? '' : c;
        Array.prototype.forEach.call(catButtons, function (b) {
          var bc = b.getAttribute('data-cat');
          if (bc) b.setAttribute('aria-pressed', bc === activeCat ? 'true' : 'false');
        });
        filterCatalog();
      });
    });

    searchInput.addEventListener('input', filterCatalog);
    searchForm.addEventListener('submit', function (e) {
      e.preventDefault();
      filterCatalog();
      searchInput.blur();
    });

    /* ---------- окно товара ---------- */
    var modal = document.getElementById('productModal');
    var mPhoto = document.getElementById('modalPhoto');
    var mThumbs = document.getElementById('modalThumbs');
    var mName = document.getElementById('modalName');
    var mPrice = document.getElementById('modalPrice');
    var mDesc = document.getElementById('modalDesc');
    var mClose = document.getElementById('modalClose');
    var photoIndex = 0;
    var lastFocus = null;

    function showPhoto(i) {
      photoIndex = i;
      mPhoto.src = current.images[i];
      mPhoto.alt = displayName(current);
      Array.prototype.forEach.call(mThumbs.children, function (b, k) {
        b.setAttribute('aria-current', k === i ? 'true' : 'false');
      });
    }

    function renderModal() {
      if (!current) return;
      mName.textContent = displayName(current);
      mPrice.textContent = current.price + ' ' + t('currency');
      var d = displayDesc(current);
      mDesc.textContent = d;
      mDesc.hidden = !d;
      mPhoto.alt = displayName(current);
    }

    function openModal(p) {
      current = p;
      mThumbs.textContent = '';
      if (p.images.length > 1) {
        p.images.forEach(function (src, i) {
          var b = document.createElement('button');
          b.type = 'button';
          var im = document.createElement('img');
          im.src = src; im.alt = '';
          b.appendChild(im);
          b.addEventListener('click', function () { showPhoto(i); });
          mThumbs.appendChild(b);
        });
      }
      renderModal();
      showPhoto(0);
      lastFocus = document.activeElement;
      modal.hidden = false;
      document.body.style.overflow = 'hidden';
      mClose.focus();
    }

    function closeModal() {
      if (modal.hidden) return;
      modal.hidden = true;
      current = null;
      document.body.style.overflow = '';
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    mClose.addEventListener('click', closeModal);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

    applyLang();

    /* ---------- каталог из базы ---------- */
    var url = (typeof SUPABASE_URL !== 'undefined' ? String(SUPABASE_URL) : '').replace(/\/$/, '');
    var key = typeof SUPABASE_KEY !== 'undefined' ? String(SUPABASE_KEY) : '';
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url) || key.length < 40) return;

    var headers = { apikey: key };
    if (key.indexOf('eyJ') === 0) headers.Authorization = 'Bearer ' + key;

    var base = 'id,name,price,category,thumb,images,description';
    function load(cols) {
      return fetch(url + '/rest/v1/products?select=' + cols + '&order=created_at.desc', { headers: headers });
    }
    // если в базе ещё нет новых колонок, запрашиваем без них
    load(base + ',name_ro,description_ro,tags')
      .then(function (r) { return r.ok ? r : load(base + ',name_ro'); })
      .then(function (r) { return r.ok ? r : load(base); })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        list.forEach(function (p) {
          if (!p || !p.images || !p.images.length) return;

          var card = document.createElement('article');
          card.className = 'catalog__card';

          var img = document.createElement('img');
          img.className = 'catalog__photo';
          img.src = p.thumb || p.images[0];
          img.alt = displayName(p) || '';
          img.loading = 'lazy';

          var body = document.createElement('div');
          body.className = 'catalog__body';

          var name = document.createElement('div');
          name.className = 'catalog__name';
          name.textContent = displayName(p) || '';

          var price = document.createElement('div');
          price.className = 'catalog__price';
          price.textContent = p.price + ' ' + t('currency');

          body.appendChild(name);
          body.appendChild(price);
          card.appendChild(img);
          card.appendChild(body);
          grid.appendChild(card);

          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.addEventListener('click', function () { openModal(p); });
          card.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(p); }
          });

          items.push({ el: card, p: p, nameEl: name, priceEl: price, key: norm((p.name || '') + ' ' + (p.name_ro || '') + ' ' + (p.tags || []).join(' ')) });
        });
        filterCatalog();
      })
      .catch(function () {});
  })();
</script>
